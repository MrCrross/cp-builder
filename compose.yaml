# Канонический Compose-файл cp-builder (см. план §15.1).
# Среды:
#   dev:  docker compose up            (подхватывает compose.override.yaml)
#   prod: docker compose -f compose.yaml -f compose.prod.yaml up -d
# Валидация конфигурации: docker compose config --quiet (не печатает значения env).

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cpbuilder}
      POSTGRES_USER: ${DB_USERNAME:-cpbuilder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # PG 18+: data dir живёт в major-version-подкаталоге /var/lib/postgresql
      # (формат pg_ctlcluster), mount только на родителя
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cp-builder-web:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_CONNECTION: pgsql
      DB_DATABASE: ${DB_DATABASE:-cpbuilder}
      DB_USERNAME: ${DB_USERNAME:-cpbuilder}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - app-storage:/var/www/html/storage
      - app-public:/var/www/html/public
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cp-builder-web:local
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_CONNECTION: pgsql
      DB_DATABASE: ${DB_DATABASE:-cpbuilder}
      DB_USERNAME: ${DB_USERNAME:-cpbuilder}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    read_only: true
    tmpfs:
      - /tmp
      - /run
    depends_on:
      db:
        condition: service_healthy
    command: ['php', 'artisan', 'migrate', '--seed', '--force']
    restart: 'no'

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - app-public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/up']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      web:
        condition: service_started

volumes:
  db-data:
  app-storage:
  app-public:
  caddy-data:
  caddy-config:
