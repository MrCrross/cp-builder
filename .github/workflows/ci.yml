name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

env:
    APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

jobs:
    backend:
        name: Backend quality, tests, PostgreSQL migrations
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18.6
                env:
                    POSTGRES_DB: cpbuilder_test
                    POSTGRES_USER: cpbuilder
                    POSTGRES_PASSWORD: cpbuilder
                ports:
                    - '5432:5432'
                options: >-
                    --health-cmd "pg_isready -U cpbuilder -d cpbuilder_test"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 12

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.5'
                  extensions: bcmath, curl, intl, mbstring, opcache, pdo_pgsql, pcntl, xml, zip
                  tools: composer:v2
                  coverage: none

            - name: Validate composer files
              run: composer validate --strict

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --optimize-autoloader

            - name: Prepare environment
              run: cp .env.example .env

            - name: Code style (Pint)
              run: vendor/bin/pint --test

            - name: Static analysis (PHPStan/Larastan)
              run: vendor/bin/phpstan analyse --no-progress

            - name: Migrations from scratch on PostgreSQL
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: '5432'
                  DB_DATABASE: cpbuilder_test
                  DB_USERNAME: cpbuilder
                  DB_PASSWORD: cpbuilder
              run: php artisan migrate:fresh --seed --force

            - name: Run tests (Pest)
              run: php artisan test --parallel

    frontend:
        name: Frontend quality, tests, production build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.5'
                  extensions: bcmath, curl, intl, mbstring, opcache, pdo_pgsql, pcntl, xml, zip
                  tools: composer:v2
                  coverage: none

            - name: Install PHP dependencies (wayfinder:generate требует PHP)
              run: composer install --prefer-dist --no-interaction --optimize-autoloader

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: npm

            - name: Install Node dependencies
              run: npm ci --no-audit --no-fund

            - name: Generate wayfinder routes
              run: php artisan wayfinder:generate --with-form --no-interaction

            - name: Dependency registry check (план §5.6)
              run: node scripts/verify-dependencies.mjs

            - name: Format + lint + types (vp check)
              run: npm run check

            - name: Svelte diagnostics (svelte-check)
              run: npm run types:check

            - name: Production build
              run: npm run build

    docker:
        name: Compose validation + production image build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Validate compose configuration
              env:
                  DB_PASSWORD: ci_placeholder
              run: |
                  cp .env.example .env
                  docker compose config --quiet

            - name: Build production image (runtime target)
              run: docker build --target runtime -t cp-builder-web:ci .
